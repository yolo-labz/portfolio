---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Build + attest + release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH for reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No `cache: pnpm` here. Release runs on tag push only; caching adds
          # marginal speed at the cost of a cache-poisoning surface that
          # zizmor flags. SLSA reproducibility relies on the lockfile, not
          # the cache.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @portfolio/web build

      - name: Package release tarball
        run: |
          NAME="portfolio-${TAG_NAME}"
          mkdir -p dist
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -czf "dist/${NAME}.tar.gz" \
              -C apps/web .next public
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate dual SBOM (CycloneDX 1.7 + SPDX 2.3)
        run: |
          syft . \
            -o cyclonedx-json@1.6=dist/portfolio-sbom.cdx.json \
            -o spdx-json=dist/portfolio-sbom.spdx.json

      - name: Attest build provenance (SLSA L2) for release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/portfolio-*.tar.gz

      - name: Attest SBOM (CycloneDX) for release tarball
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v2.1.0
        with:
          subject-path: dist/portfolio-*.tar.gz
          sbom-path: dist/portfolio-sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/portfolio-*.tar.gz
            dist/portfolio-*.tar.gz.sha256
            dist/portfolio-sbom.cdx.json
            dist/portfolio-sbom.spdx.json
          generate_release_notes: true
