name: SonarQube scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout (full history for blame-based coverage)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if SonarQube host not configured
        id: check
        env:
          HOST: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -z "$HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_HOST_URL variable not set — skipping Sonar scan."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Every scan downloads the scanner JRE, the scanner engine and the analyzer plugins
      # from the SonarQube server. Under concurrent scans the server drops some of those
      # downloads ("Call to URL [.../api/v2/analysis/engine] failed: closed", "Fail to
      # download plugin [javascript] ... Connection reset"), and the required check goes red.
      # ponytail: the key only rolls when this file changes; after a server upgrade the
      # scanner re-downloads what changed until the next roll.
      - name: Cache scanner JRE, engine and plugins
        if: steps.check.outputs.skip == 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-scanner-${{ runner.os }}-${{ hashFiles('.github/workflows/sonar.yml') }}
          restore-keys: sonar-scanner-${{ runner.os }}-

      - name: SonarQube scan
        if: steps.check.outputs.skip == 'false'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=yolo-labz_portfolio
            -Dsonar.projectName=portfolio
            -Dsonar.sources=apps,packages,projects,scripts
            -Dsonar.tests=apps,packages,projects
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.test.js,**/*.test.mjs
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/.turbo/**,**/dist/**,**/build/**,**/coverage/**,**/.specify/**,**/public/**,**/*.tsbuildinfo,**/next-env.d.ts,**/data/**,**/test-results/**,**/playwright-report/**,**/*.spec.ts-snapshots/**
            -Dsonar.typescript.tsconfigPath=tsconfig.base.json
            -Dsonar.sourceEncoding=UTF-8
