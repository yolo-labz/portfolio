# Lighthouse + a11y budget gate — the CI enforcement of the constitution's
# "Lighthouse targets: 95+ on Performance, Accessibility, Best Practices, SEO"
# (Principle IV). Until now nothing enforced it: visual-regression compares
# pixels, not budgets. Lighthouse's accessibility category runs axe-core, so
# this also covers the axe/a11y requirement.
#
# Builds the @portfolio/web standalone bundle exactly as Dockerfile.dokku and
# playwright.config.ts do (next build + copy public/static), serves it on :3000,
# waits on the real /api/health endpoint, then runs @lhci/cli against the three
# top locale routes. Thresholds live in lighthouserc.json. Chrome is preinstalled
# on the ubuntu-latest runner image; lhci's chrome-launcher discovers it.
#
# SHA-pinned actions per yolo-labz release-engineering policy. Workflow-level
# deny-all `permissions: {}` + per-job `contents: read`. No untrusted
# github.event.* fields are interpolated into run: blocks.
name: lighthouse

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lighthouse:
    name: lighthouse + a11y budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.2
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build standalone server
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        run: |
          pnpm --filter @portfolio/web build
          cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static

      - name: Serve + run Lighthouse CI
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        run: |
          set -uo pipefail
          PORT=3000 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::standalone server never became healthy on :3000"
            exit 1
          fi
          echo "server healthy — running @lhci/cli"
          npx -y @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
          status=$?
          echo "lhci exit status (desktop): ${status}"
          # Each autorun resets .lighthouseci/, so park the desktop reports first.
          rm -rf .lighthouseci-desktop && mv .lighthouseci .lighthouseci-desktop
          npx -y @lhci/cli@0.15.1 autorun --config=./lighthouserc.mobile.json
          mobile_status=$?
          echo "lhci exit status (mobile): ${mobile_status}"
          rm -rf .lighthouseci-mobile && mv .lighthouseci .lighthouseci-mobile
          [ "$status" -eq 0 ] && [ "$mobile_status" -eq 0 ]

      - name: Print category scores
        if: always()
        run: |
          shopt -s nullglob
          found=0
          for f in .lighthouseci-desktop/lhr-*.json .lighthouseci-mobile/lhr-*.json; do
            found=1
            node -e "const r=require('./$f');const c=r.categories,a=r.audits;console.log(r.configSettings.formFactor+' '+r.requestedUrl);for(const k of Object.keys(c)){console.log('  '+k+': '+Math.round((c[k].score||0)*100));}console.log('  LCP ms: '+Math.round(a['largest-contentful-paint'].numericValue)+'  CLS: '+a['cumulative-layout-shift'].numericValue.toFixed(3));"
          done
          [ "$found" -eq 0 ] && echo "no Lighthouse reports produced (collect failed before assert)"
          true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ github.run_id }}
          path: |
            .lighthouseci-desktop/
            .lighthouseci-mobile/
          retention-days: 14
          if-no-files-found: ignore
          # The report dirs are dot-dirs; upload-artifact skips hidden files by
          # default, which left every past run without its reports.
          include-hidden-files: true
